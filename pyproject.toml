[project]
name = "hiring-market-pulse"
version = "0.1.0"
description = "Tested pipeline turning HN 'Who is hiring?' threads and BLS JOLTS data into hiring-market insights."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pandas>=2.2",
    "pyarrow>=17",
    "typer>=0.12",
]

[project.optional-dependencies]
app = ["streamlit>=1.38", "plotly>=5.24"]
warehouse = ["dbt-core>=1.8", "dbt-databricks>=1.8", "databricks-sql-connector>=3.4"]
llm = ["ollama>=0.3", "anthropic>=0.40"]

[project.scripts]
pulse = "pulse.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "duckdb>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Job posts use en/em dashes in salary ranges; matching them is intentional.
ignore = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pulse"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow.*", "ollama.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: hits real external APIs (excluded from CI by default)"]

[tool.coverage.run]
source = ["pulse"]
branch = true

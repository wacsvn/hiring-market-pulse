# No secrets here: everything comes from environment variables (.env locally, GitHub secrets in CI).
pulse:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: workspace
      schema: "{{ env_var('DBT_SCHEMA', 'pulse_dev') }}"
      threads: 4
      connect_retries: 3
      connect_timeout: 60

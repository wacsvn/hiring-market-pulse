name: Live dashboard smoke test

# Checks the deployed app every 8 hours (and on demand), so a broken deploy shows up as a red
# run instead of being found by a visitor. The visit also keeps the free Streamlit app from
# sleeping: it sleeps after ~12 hours without visitors, and GitHub can start scheduled runs
# hours late, so 8 hours is the longest interval that reliably keeps it awake.
on:
  schedule:
    - cron: "41 */8 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      LIVE_URL: https://hiring-market-pulse.streamlit.app
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-smoke-report
          path: |
            e2e/playwright-report
            e2e/test-results

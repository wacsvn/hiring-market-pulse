name: Live dashboard smoke test

# Checks the deployed app after the daily refresh (and on demand), so a broken deploy shows
# up as a red run instead of being found by a visitor.
on:
  schedule:
    - cron: "17 13 * * *" # two hours after the refresh workflow
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      LIVE_URL: https://hiring-market-pulse.streamlit.app
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-smoke-report
          path: |
            e2e/playwright-report
            e2e/test-results

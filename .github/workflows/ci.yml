name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - name: Pre-commit hooks (the same checks that run before each local commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: e2e-typecheck # the e2e job type-checks the Playwright tests with Node set up
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  scrub:
    name: Scrub check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/scrub_check.sh
        env:
          SCRUB_PATTERN: ${{ secrets.SCRUB_PATTERN }}

  dbt:
    name: dbt build on fixture data (Databricks)
    runs-on: ubuntu-latest
    needs: python
    # Secrets are not available to PRs from forks; skip rather than fail there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      # One isolated pair of schemas per PR (or branch), reused across its runs (tables are
      # replaced in place) and dropped by ci-cleanup.yml when the PR closes. Dropping after
      # every run would count every table against the workspace table quota for 7 days.
      PULSE_RAW_SCHEMA: ci_${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.ref_name }}_raw
      DBT_SCHEMA: ci_${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.ref_name }}
      PULSE_DATA_DIR: ${{ github.workspace }}/data
      PULSE_MIN_POSTS_PER_MONTH: "10" # fixture threads are trimmed to 15 posts each
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - name: Check warehouse connectivity
        # Fails here (not in a test step) if Databricks is unreachable or over its daily quota.
        run: uv run dbt debug --project-dir dbt --profiles-dir dbt
      - name: Build fixture dataset (same pipeline code as production, recorded API responses)
        run: uv run python scripts/build_fixture_data.py
      - run: uv run pulse load-warehouse --raw-schema "$PULSE_RAW_SCHEMA"
      - run: uv run dbt deps --project-dir dbt --profiles-dir dbt
      - run: uv run dbt build --project-dir dbt --profiles-dir dbt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dbt-run-results
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
          if-no-files-found: ignore

  e2e:
    name: Dashboard e2e (Playwright)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/results
          if-no-files-found: ignore

name: Clean up PR schemas

# CI and the mutation check keep one set of Databricks schemas per pull request and reuse
# them across runs. Once the PR is merged or closed, drop them.
on:
  pull_request:
    types: [closed]

jobs:
  drop:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      PR: pr${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync --extra warehouse --locked
      - run: >
          uv run pulse drop-schemas
          "ci_${PR}" "ci_${PR}_raw" "mut_${PR}_raw" "mut_${PR}_raw_mut" "mut_${PR}_raw_mut_dbt"
